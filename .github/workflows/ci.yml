name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build
      - name: Configure
        run: |
          SAN="-fsanitize=${{ matrix.mode }} -fno-omit-frame-pointer -g"
          [ "${{ matrix.mode }}" = plain ] && SAN=""
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DORANGEHUD_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="$SAN" -DCMAKE_CXX_FLAGS="$SAN" -DCMAKE_EXE_LINKER_FLAGS="$SAN"
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  ps5-build:
    name: Console build (ps5-payload-sdk)
    runs-on: ubuntu-latest
    env:
      # Official SDK release, pinned so builds are reproducible.
      SDK_VERSION: v0.43
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 unzip ninja-build cmake
      - name: Download ps5-payload-sdk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ps5-payload-sdk.zip" \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"
          # the SDK wrappers pick the highest llvm-config they find; pin it to
          # the version installed above (an absolute path: the wrapper
          # resolves it with readlink -f)
          echo "LLVM_CONFIG=$(command -v llvm-config-18)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ps5-release
      - name: Build
        run: cmake --build --preset ps5-release
      - name: Checksum
        run: sha256sum OrangeHUD.elf > OrangeHUD.elf.sha256
        working-directory: build/ps5-release/bin
      - uses: actions/upload-artifact@v4
        with:
          name: OrangeHUD
          path: |
            build/ps5-release/bin/OrangeHUD.elf
            build/ps5-release/bin/OrangeHUD.elf.sha256
          if-no-files-found: error
