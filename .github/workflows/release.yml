name: Release

# Push a tag like v1.0.0 on main (it must match the VERSION file); this builds
# the console payload and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      # Official SDK release, pinned so builds are reproducible.
      SDK_VERSION: v0.43
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag is on main and matches VERSION
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
          [ "${GITHUB_REF_NAME}" = "v$(cat VERSION)" ] \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 unzip ninja-build cmake
      - name: Download ps5-payload-sdk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ps5-payload-sdk.zip" \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$(command -v llvm-config-18)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake --preset ps5-release
          cmake --build --preset ps5-release
      - name: Checksum
        run: sha256sum OrangeHUD.elf > OrangeHUD.elf.sha256
        working-directory: build/ps5-release/bin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's generated notes name the authors and add a "New
          # Contributors" section; keep only the list of changes.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body \
            | sed -E 's/ by @[A-Za-z0-9-]+( in |$)/\1/' \
            | awk '/^## New Contributors/ {skip=1; next} /^\*\*Full Changelog/ {skip=0} !skip' \
            > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            build/ps5-release/bin/OrangeHUD.elf build/ps5-release/bin/OrangeHUD.elf.sha256 \
            --title "OrangeHUD ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
